# Skill definitions use a Markdown editor; other repository docs stay in raw mode.
content:
  - name: repository-docs
    label: Repository docs
    type: group
    items:
      - name: repo-README-md
        label: README
        type: file
        path: README.md
        format: raw
        operations:
          create: false
          delete: false
      - name: repo-CHANGELOG-md
        label: Project changelog
        type: file
        path: CHANGELOG.md
        format: raw
        operations:
          create: false
          delete: false
      - name: repo-docs-skill-versioning-follow-up-md
        label: Skill versioning
        type: file
        path: docs/skill-versioning-follow-up.md
        format: raw
        operations:
          create: false
          delete: false
  - name: skills
    label: Skills
    type: group
    items:
      - name: agent-conversation
        label: agent-conversation
        type: group
        items:
          - name: agent-conversation-skill
            label: Skill definition
            type: file
            path: skills/agent-conversation/SKILL.md
            format: yaml-frontmatter
            fields:
              - &skill-name
                name: name
                type: string
                required: true
              - &skill-description
                name: description
                type: text
                required: true
              - &skill-metadata
                name: metadata
                type: object
                fields:
                  - name: version
                    type: string
              - name: compatibility
                type: text
              - &skill-body
                name: body
                type: rich-text
                options:
                  format: markdown
                  switcher: true
            operations:
              create: false
              delete: false
          - name: agent-conversation-changelog
            label: Changelog
            type: file
            path: skills/agent-conversation/CHANGELOG.md
            format: raw
            operations:
              create: false
              delete: false
      - name: agent-enablement
        label: agent-enablement
        type: group
        items:
          - name: agent-enablement-skill
            label: Skill definition
            type: file
            path: skills/agent-enablement/SKILL.md
            format: yaml-frontmatter
            fields:
              - *skill-name
              - *skill-description
              - *skill-metadata
              - *skill-body
            operations:
              create: false
              delete: false
          - name: agent-enablement-changelog
